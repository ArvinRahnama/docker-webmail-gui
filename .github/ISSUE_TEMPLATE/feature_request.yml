name: Feature request
description: Propose a new capability or improvement for the panel.
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        This project ships a UI control only when a real backend operation
        actually supports it — see `FEATURE_MATRIX.md` for what
        `docker-mailserver`, the Docker Engine API, and the mail stack can and
        cannot do today. A request that describes a nice UI without a
        real underlying capability will need research before it can be
        scoped, rather than being implemented directly.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation or pain point first — not the solution yet.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like the panel to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or existing features that partially cover this.

  - type: textarea
    id: upstream-capability
    attributes:
      label: What upstream capability would this be built on?
      description: >
        Name the docker-mailserver `setup` subcommand, config file, Docker
        Engine API call, or other real mechanism this request would use. If
        you don't know, say so plainly — that's useful information too, and
        may mean this needs research before it can be scoped.
      placeholder: e.g. "setup config dkim", "GET /containers/{id}/stats", a specific *.cf file, ...
    validations:
      required: true

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Acknowledgement
      options:
        - label: >
            I understand this project will not ship a UI control that
            docker-mailserver cannot actually perform (see `FEATURE_MATRIX.md`),
            and I've named the real upstream capability this request would use
            above, as best I can.
          required: true
