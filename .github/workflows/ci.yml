name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Supersede in-flight runs for the same branch or PR — a force-push should
# not leave stale jobs burning runner time and reporting outdated results.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs before the others because a major-version skew between
      # workspaces makes every check below misleading rather than wrong:
      # npm hoists one copy, so a workspace can pass its tests against a
      # version it does not actually declare. See the script's header.
      - name: Dependency consistency
        run: npm run check:deps

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Browsers are cached by neither `npm ci` nor actions/setup-node —
      # they're downloaded binaries, not an npm dependency — so this is a
      # separate step. Chromium only: this repository has one project
      # (playwright.config.ts) and no cross-browser requirement yet.
      # `--with-deps` additionally installs the OS shared libraries
      # Chromium needs, which a bare Ubuntu runner doesn't have; a
      # developer's own machine usually already does, which is why this
      # flag isn't part of `npm run test:e2e` itself.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Builds the real server (webServer's command in playwright.config.ts)
      # and drives it with the fake Docker/DMS/DNS/TLS/Rspamd/registry
      # drivers — no Docker daemon, no live docker-mailserver, no outbound
      # network call. `playwright test` itself fails (non-zero exit) if
      # e2e/ ever matches zero spec files, so a regression that deleted or
      # misconfigured the suite fails this job rather than passing silently.
      - name: Run E2E tests
        run: npm run test:e2e
