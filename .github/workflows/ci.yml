name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Supersede in-flight runs for the same branch or PR — a force-push should
# not leave stale jobs burning runner time and reporting outdated results.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs before the others because a major-version skew between
      # workspaces makes every check below misleading rather than wrong:
      # npm hoists one copy, so a workspace can pass its tests against a
      # version it does not actually declare. See the script's header.
      - name: Dependency consistency
        run: npm run check:deps

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
