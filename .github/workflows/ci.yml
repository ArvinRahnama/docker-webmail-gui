# Every check this repository runs, as one workflow: one run per push or
# pull request, every job in parallel (about four minutes end to end).
#
#   build-and-test     lint, typecheck, unit and integration tests, build
#   e2e                Playwright against the fake drivers, no Docker
#   installer          real Docker: install -> healthy -> uninstall, twice
#   self-update        real Docker: the panel recreates its own containers
#   mcp-integration    real docker-mailserver: IMAP/SMTP through the MCP service
#   audit              npm audit of production dependencies — also weekly
#   dependency-review  pull requests only: new advisories and copyleft licenses
#   sbom               CycloneDX SBOM and the permissive-license gate
#
# release.yml cuts a release only from a commit this whole workflow passed
# on main, so a release now waits for the real-Docker jobs and the audit too.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: {}
  schedule:
    # Catches newly disclosed advisories against an otherwise-unchanged
    # lockfile, not just at push/PR time. Only the audit job runs then.
    - cron: '0 6 * * 1'

permissions:
  contents: read

# Supersede in-flight runs for the same branch or PR — a force-push should
# not leave stale jobs burning runner time and reporting outdated results.
# The event name keeps the weekly audit and a push to main from cancelling
# each other.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, typecheck, test, build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs before the others because a major-version skew between
      # workspaces makes every check below misleading rather than wrong:
      # npm hoists one copy, so a workspace can pass its tests against a
      # version it does not actually declare. See the script's header.
      - name: Dependency consistency
        run: npm run check:deps

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Browsers are cached by neither `npm ci` nor actions/setup-node —
      # they're downloaded binaries, not an npm dependency — so this is a
      # separate step. Chromium only: both of this repository's Playwright
      # projects (playwright.config.ts — 'chromium' and the dedicated
      # 'chromium-serial') use Desktop Chrome, and there's no
      # cross-browser requirement yet. `--with-deps` additionally installs
      # the OS shared libraries
      # Chromium needs, which a bare Ubuntu runner doesn't have; a
      # developer's own machine usually already does, which is why this
      # flag isn't part of `npm run test:e2e` itself.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # `npm run test:e2e`'s `pretest:e2e` hook builds packages/shared,
      # apps/server and apps/web once, up front (playwright.config.ts's
      # webServer entries just run the results) — every server this run
      # drives with the fake Docker/DMS/DNS/TLS/Rspamd/registry drivers,
      # no Docker daemon, no live docker-mailserver, no outbound network
      # call. `playwright test` itself fails (non-zero exit) if e2e/ ever
      # matches zero spec files, so a regression that deleted or
      # misconfigured the suite fails this job rather than passing silently.
      - name: Run E2E tests
        run: npm run test:e2e

  # M13's exit criterion, run for real: "Clean-VM install -> healthy ->
  # uninstall, twice (idempotency)" (IMPLEMENTATION_PLAN.md §3). The
  # machine this job was written on has no reachable Docker daemon at
  # all (confirmed directly: the socket exists but the session's user has no
  # permission to use it) — this job is deliberately where that
  # verification actually happens, on a real Linux runner with real Docker,
  # rather than being simulated or merely asserted. See docs/docker.md §6
  # for the one-page version of the same point, including what is still
  # *not* covered here.
  #
  # Beyond "does it come up healthy", this asserts three things that are
  # otherwise only claims:
  #
  #   1. The privilege boundary is real in the running containers, not just
  #      in the compose file's intent — the broker holds the socket and
  #      publishes no ports; the server has no Docker socket on any path
  #      and no Docker client library on disk.
  #   2. The same-origin topology M13's `@fastify/static` change introduced
  #      actually works in the shipped image: the SPA is served, a
  #      client-side route still returns the app shell, and an unmatched
  #      `/api/*` path still returns the JSON error envelope rather than
  #      that shell.
  #   3. Re-running the installer is genuinely non-destructive — including
  #      to settings an operator changed by hand after installing, which is
  #      the failure mode a byte-comparison of an untouched `.env` would
  #      never notice.
  #   4. The optional MCP integration (cycle 4), which runs inside the
  #      server container, answers on its own listener only when enabled,
  #      publishes nothing but loopback by default, keeps the panel's API off
  #      its port, and its vault key survives re-installs and a default
  #      uninstall and goes only with --purge.
  installer:
    name: Install, verify, uninstall (twice)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE: docker compose -f docker/compose.yaml --env-file .env
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Confirm this runner actually has Docker (the whole point of running here)
        run: |
          docker version
          docker compose version

      # A minimal stand-in for docker-mailserver — present *before* the
      # first install, so install.sh's best-effort network-join runs for
      # real on every cycle below, not just as an untested code path.
      # docker-webmail-gui does not deploy docker-mailserver itself
      # (DMS_CONTAINER_NAME/LABEL, .env.example: "the broker resolves the
      # mail container's identity itself... from configuration") — this
      # container only needs to *exist*, named correctly, on some
      # network, for the broker's name-based resolution
      # (container-resolver.ts) and install.sh's network-join step to
      # have something real to find. It is not a real mail server, and
      # nothing here claims it exercises real DMS integration (Rspamd
      # reachability, mailbox operations against a live DMS) — that
      # remains a documented manual/future verification step (see
      # docs/docker.md §6).
      - name: Start a placeholder "mailserver" container
        run: |
          docker network create dms-placeholder-net
          docker run -d --name mailserver --network dms-placeholder-net --label com.docker-webmail-gui.role=mail alpine:3.20 sleep infinity

      - name: shellcheck installer/*.sh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --shell=sh installer/install.sh installer/uninstall.sh

      - name: Validate docker/compose.yaml and the MCP overlay (static config check, no daemon needed)
        run: |
          COOKIE_SECRET=placeholder BROKER_SHARED_SECRET=placeholder DOCKER_GID=999 \
            docker compose -f docker/compose.yaml config >/dev/null
          COOKIE_SECRET=placeholder BROKER_SHARED_SECRET=placeholder DOCKER_GID=999 \
            docker compose -f docker/compose.yaml -f docker/compose.mcp.yaml config >/dev/null

      # The uninstaller has to work with no .env at all — that is the
      # state `--purge` itself leaves behind, and Compose interpolates
      # docker/compose.yaml's `${VAR:?...}` required variables even for
      # `down`. Checked statically here, before anything has been
      # installed, so a regression shows up as its own failing step rather
      # than as a confusing teardown failure at the end of a long job.
      - name: Teardown must not need .env (uninstall.sh's no-.env path)
        run: |
          test ! -f .env
          ./installer/uninstall.sh

      # -----------------------------------------------------------------
      # Cycle 1 — fresh install, full verification, non-destructive
      # re-install, default (data-preserving) uninstall.
      # -----------------------------------------------------------------
      # MCP is on by default (cycle 3 checks that); cycles 1–2 cover the
      # opt-out, so this .env pins it off for every re-install below.
      - name: 'Cycle 1: install'
        run: MCP_ENABLED=false ./installer/install.sh

      - name: 'Cycle 1: verify health'
        run: curl -fsS http://127.0.0.1:3000/api/v1/health | tee /dev/stderr | grep -q '"status":"ok"'

      # A fresh install defaults to this checkout's own release.
      - name: 'Cycle 1: verify DWG_VERSION defaults to the checkout version'
        run: grep -qx "DWG_VERSION=$(node -p "require('./package.json').version")" .env

      # With MCP off, the install must need no vault key and the server must
      # publish nothing but the panel port.
      - name: 'Cycle 1: MCP off needs no vault key and opens no MCP port'
        run: |
          set -eu
          [ ! -e secrets/mcp_vault_key ] || { echo "FAIL: an MCP-off install created a vault key"; exit 1; }
          SERVER_CID=$(${COMPOSE} ps -q server)
          PORTS=$(docker inspect --format '{{json .NetworkSettings.Ports}}' "${SERVER_CID}")
          echo "server ports: ${PORTS}"
          # The image EXPOSEs 3100, so it is always listed; published means a binding list.
          if echo "${PORTS}" | grep -q '"3100/tcp":\['; then echo "FAIL: port 3100 is published with MCP off"; exit 1; fi
          if docker exec "${SERVER_CID}" test -e /run/secrets/mcp_vault_key; then echo "FAIL: the vault key is mounted with MCP off"; exit 1; fi

      - name: 'Cycle 1: verify the SPA is served from the same origin as the API'
        run: |
          set -eu

          echo "--- GET / must return the built SPA shell ---"
          curl -fsS http://127.0.0.1:3000/ -o /tmp/index.html
          grep -q '<div id="root">' /tmp/index.html
          echo "confirmed: app shell served."

          echo "--- the shell's hashed asset must actually be fetchable ---"
          ASSET=$(grep -o '/assets/[A-Za-z0-9._-]*\.js' /tmp/index.html | head -n1)
          test -n "${ASSET}"
          curl -fsS "http://127.0.0.1:3000${ASSET}" -o /dev/null
          echo "confirmed: ${ASSET} served."

          echo "--- a client-side route must fall back to the shell, not 404 ---"
          curl -fsS http://127.0.0.1:3000/mail/domains | grep -q '<div id="root">'
          echo "confirmed: SPA fallback works for a browser refresh on a client route."

          echo "--- an unmatched /api/ path must still be a JSON 404, never the shell ---"
          CODE=$(curl -s -o /tmp/api404.json -w '%{http_code}' http://127.0.0.1:3000/api/v1/definitely-not-a-route)
          cat /tmp/api404.json
          [ "${CODE}" = "404" ] || { echo "FAIL: expected 404, got ${CODE}"; exit 1; }
          grep -q '"NOT_FOUND"' /tmp/api404.json
          # `if grep -q`, never `grep -qv`: -v inverts the *line* match, so it
          # succeeds as soon as any single line differs, which is not the
          # question being asked here. And never a bare `! grep -q`: `set -e`
          # ignores a negated command, so it could never fail the step.
          if grep -q '<div id="root">' /tmp/api404.json; then echo "FAIL: an API 404 returned the SPA shell"; exit 1; fi
          echo "confirmed: the SPA fallback does not swallow API 404s."

      - name: 'Cycle 1: verify the privilege boundary is real, not just described'
        run: |
          set -eu
          SERVER_CID=$(${COMPOSE} ps -q server)
          BROKER_CID=$(${COMPOSE} ps -q broker)

          # Every mount destination, not one hardcoded path: the claim is
          # that the web tier has no Docker socket *anywhere* in its
          # filesystem, and checking only /var/run/docker.sock would leave
          # the claim broader than the check.
          echo "--- server: no Docker socket on any mount path ---"
          SERVER_MOUNTS=$(docker inspect --format '{{range .Mounts}}{{.Source}}:{{.Destination}} {{end}}' "${SERVER_CID}")
          echo "server mounts: ${SERVER_MOUNTS}"
          case "${SERVER_MOUNTS}" in
            *docker.sock*) echo "FAIL: the server container has a Docker socket mounted"; exit 1 ;;
          esac
          docker exec "${SERVER_CID}" sh -c '! test -S /var/run/docker.sock'
          echo "confirmed absent."

          echo "--- server: no Docker client library in its runtime node_modules ---"
          docker exec "${SERVER_CID}" sh -c '! test -e node_modules/dockerode && ! test -e node_modules/docker-modem'
          echo "confirmed absent."

          echo "--- broker: must have the Docker socket ---"
          docker exec "${BROKER_CID}" test -S /var/run/docker.sock

          echo "--- broker: must publish no ports to the host ---"
          BROKER_PORTS=$(docker inspect --format '{{json .NetworkSettings.Ports}}' "${BROKER_CID}")
          echo "broker NetworkSettings.Ports: ${BROKER_PORTS}"
          case "${BROKER_PORTS}" in
            *HostPort*) echo "FAIL: broker has a published host port"; exit 1 ;;
          esac

          echo "--- broker: must not be on the frontend network ---"
          BROKER_NETS=$(docker inspect --format '{{range $n,$c := .NetworkSettings.Networks}}{{$n}} {{end}}' "${BROKER_CID}")
          echo "broker networks: ${BROKER_NETS}"
          case " ${BROKER_NETS} " in
            *" dwg-frontend "*) echo "FAIL: broker is on the frontend network"; exit 1 ;;
          esac

          echo "--- broker network itself: must be internal (no route to/from the internet) ---"
          docker network inspect dwg-broker --format '{{.Internal}}' | grep -qx true

          echo "--- both containers: non-root, read-only rootfs, all capabilities dropped, no-new-privileges, bounded PIDs ---"
          for cid in "${SERVER_CID}" "${BROKER_CID}"; do
            docker inspect --format '{{.Config.User}}:{{.HostConfig.ReadonlyRootfs}}:{{.HostConfig.CapDrop}}:{{.HostConfig.SecurityOpt}}:{{.HostConfig.PidsLimit}}' "${cid}"
            [ "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "${cid}")" = "true" ]
            docker inspect --format '{{.HostConfig.CapDrop}}' "${cid}" | grep -qi "\[ALL\]"
            docker inspect --format '{{.HostConfig.SecurityOpt}}' "${cid}" | grep -qi "no-new-privileges"
            [ "$(docker inspect --format '{{.HostConfig.PidsLimit}}' "${cid}")" -gt 0 ]
            USER_ID=$(docker exec "${cid}" id -u)
            [ "${USER_ID}" != "0" ] || { echo "FAIL: ${cid} is running as root"; exit 1; }
          done
          echo "All privilege-boundary assertions passed."

      - name: 'Cycle 1: install again (idempotency — secrets must not change)'
        run: |
          set -eu
          cp .env /tmp/env-before-reinstall
          ./installer/install.sh
          if ! diff -q /tmp/env-before-reinstall .env >/dev/null; then
            echo "FAIL: re-running install.sh changed .env — secrets are not supposed to regenerate on an existing install"
            diff /tmp/env-before-reinstall .env || true
            exit 1
          fi
          echo "confirmed: .env unchanged across a second install run."

      # An untouched .env surviving a re-install proves less than it
      # looks: it is also what a script that rewrote every key back to its
      # *default* would produce. This edits the file the way docs/docker.md
      # tells an operator to, including a key install.sh does not manage at
      # all, and then re-installs.
      - name: 'Cycle 1: install again after hand-editing .env (operator settings must survive)'
        run: |
          set -eu
          sed -i 's/^COOKIE_SECURE=.*/COOKIE_SECURE=false/' .env
          sed -i 's/^LOG_LEVEL=.*/LOG_LEVEL=debug/' .env
          sed -i 's/^RSPAMD_PASSWORD=.*/RSPAMD_PASSWORD=an-operator-chosen-value/' .env
          sed -i 's/^ENABLE_EXEC_CONSOLE=.*/ENABLE_EXEC_CONSOLE=true/' .env
          printf 'SOME_UNMANAGED_KEY=kept\n' >> .env
          ./installer/install.sh
          for expected in 'COOKIE_SECURE=false' 'LOG_LEVEL=debug' \
                          'RSPAMD_PASSWORD=an-operator-chosen-value' \
                          'ENABLE_EXEC_CONSOLE=true' 'SOME_UNMANAGED_KEY=kept'; do
            grep -qx "${expected}" .env || { echo "FAIL: re-installing lost ${expected}"; cat .env; exit 1; }
          done
          echo "confirmed: hand-edited settings, including an unmanaged key, survived the upgrade."
          # Put the security-relevant ones back before the rest of the run.
          sed -i 's/^COOKIE_SECURE=.*/COOKIE_SECURE=true/' .env
          sed -i 's/^ENABLE_EXEC_CONSOLE=.*/ENABLE_EXEC_CONSOLE=false/' .env
          sed -i '/^SOME_UNMANAGED_KEY=/d' .env
          ./installer/install.sh

      - name: 'Cycle 1: verify health again after the idempotent re-installs'
        run: curl -fsS http://127.0.0.1:3000/api/v1/health | grep -q '"status":"ok"'

      - name: 'Cycle 1: uninstall (default — GUI only, own data and mail server untouched)'
        run: ./installer/uninstall.sh

      - name: 'Cycle 1: verify containers and networks are gone, own data volumes are not'
        run: |
          set -eu
          [ -z "$(${COMPOSE} ps -q)" ]
          docker network inspect dwg-frontend >/dev/null 2>&1 && { echo "FAIL: dwg-frontend still exists"; exit 1; }
          docker volume inspect dwg-server-data >/dev/null
          docker volume inspect dwg-server-backups >/dev/null
          test -f .env
          docker inspect mailserver >/dev/null
          echo "confirmed: GUI torn down; own data volumes, .env and the mail server container all survived, as documented."

      - name: 'Cycle 1: uninstall again (idempotency — a second run is a safe no-op, not an error)'
        run: ./installer/uninstall.sh

      # -----------------------------------------------------------------
      # Cycle 2 — a full second install -> healthy -> uninstall pass, this
      # time exercising --purge, --remove-images and --remove-mail-server
      # for real. The install here is an *upgrade* (cycle 1 deliberately
      # left .env and the data volumes behind), which is the other half of
      # the idempotency claim: an uninstall/reinstall round trip recovers
      # the same install rather than producing a new one.
      # -----------------------------------------------------------------
      - name: 'Cycle 2: install (recovers the install cycle 1 left behind)'
        run: |
          set -eu
          cp .env /tmp/env-before-cycle2
          ./installer/install.sh
          diff -q /tmp/env-before-cycle2 .env
          echo "confirmed: the reinstall recovered the previous install's identity, byte for byte."

      - name: 'Cycle 2: verify health'
        run: curl -fsS http://127.0.0.1:3000/api/v1/health | grep -q '"status":"ok"'

      - name: 'Cycle 2: uninstall --purge --remove-images --remove-mail-server'
        env:
          DWG_CONFIRM_PURGE: 'yes'
          DWG_CONFIRM_REMOVE_MAIL: 'yes'
        run: ./installer/uninstall.sh --purge --remove-images --remove-mail-server

      - name: 'Cycle 2: verify everything is actually gone this time'
        run: |
          set -eu
          docker volume inspect dwg-server-data >/dev/null 2>&1 && { echo "FAIL: dwg-server-data survived --purge"; exit 1; }
          docker volume inspect dwg-server-backups >/dev/null 2>&1 && { echo "FAIL: dwg-server-backups survived --purge"; exit 1; }
          docker inspect mailserver >/dev/null 2>&1 && { echo "FAIL: mailserver container survived --remove-mail-server"; exit 1; }
          docker image inspect docker-webmail-gui-server:local >/dev/null 2>&1 && { echo "FAIL: the server image survived --remove-images"; exit 1; }
          docker image inspect docker-webmail-gui-broker:local >/dev/null 2>&1 && { echo "FAIL: the broker image survived --remove-images"; exit 1; }
          [ ! -f .env ] || { echo "FAIL: .env survived --purge"; exit 1; }
          echo "--- and the placeholder mail server's network and volumes were never this script's to touch ---"
          docker network inspect dms-placeholder-net >/dev/null
          echo "confirmed: --purge, --remove-images and --remove-mail-server each did exactly what they claim, and no more."

      - name: 'Cycle 2: uninstall again after a full purge (no .env left to read)'
        env:
          DWG_CONFIRM_PURGE: 'yes'
          DWG_CONFIRM_REMOVE_MAIL: 'yes'
        run: ./installer/uninstall.sh --purge --remove-images --remove-mail-server

      # -----------------------------------------------------------------
      # Cycle 3 — the state a genuinely clean VM starts in is now the
      # state cycle 2 left behind, so this is the closest thing this
      # workflow has to a second *clean-VM* install: no .env, no volumes,
      # no images, no mail server. It must produce a fresh install with a
      # new bootstrap credential, not an upgrade of something that is gone.
      # -----------------------------------------------------------------
      - name: 'Cycle 3: install onto the purged host (must be fresh, not an upgrade)'
        run: |
          set -eu
          # pipefail matters here: without it the pipeline's status is tee's,
          # so a failed install would be reported as a passing step.
          set -o pipefail
          ./installer/install.sh | tee /tmp/install3.log
          grep -q 'First-time login' /tmp/install3.log
          if grep -q 'Existing installation found' /tmp/install3.log; then echo "FAIL: the post-purge install ran as an upgrade"; exit 1; fi
          echo "confirmed: a post-purge install is a genuinely fresh one."

      # Nothing set MCP_ENABLED for this fresh install, so this is the default.
      - name: 'Cycle 3: MCP is on by default, with its own vault key'
        run: |
          set -eu
          grep -qx 'MCP_ENABLED=true' .env
          grep -q 'MCP listener answering on port 3100' /tmp/install3.log
          test "$(stat -c '%a' secrets/mcp_vault_key)" = "444"
          curl -fsS http://127.0.0.1:3100/healthz | grep -q '"status":"ok"'

      - name: 'Cycle 3: verify health'
        run: curl -fsS http://127.0.0.1:3000/api/v1/health | grep -q '"status":"ok"'

      - name: 'Cycle 3: uninstall --purge'
        env:
          DWG_CONFIRM_PURGE: 'yes'
        run: ./installer/uninstall.sh --purge

      # -----------------------------------------------------------------
      # Cycle 4 — the optional MCP integration (docs/mcp-integration.md),
      # inside the server container. Off in cycles 1–2, on by default in
      # cycle 3; here it is turned on, verified, turned off again, and purged.
      # -----------------------------------------------------------------
      - name: 'Cycle 4: install with MCP_ENABLED=true'
        run: |
          set -eu
          set -o pipefail
          docker network create dms-placeholder-net 2>/dev/null || true
          docker run -d --name mailserver --network dms-placeholder-net alpine:3.20 sleep infinity
          MCP_ENABLED=true ./installer/install.sh | tee /tmp/install4.log
          grep -q 'MCP listener answering on port 3100' /tmp/install4.log
          grep -qx 'MCP_ENABLED=true' .env
          test "$(stat -c '%a' secrets)" = "700"
          test "$(stat -c '%a' secrets/mcp_vault_key)" = "444"
          sha256sum secrets/mcp_vault_key > /tmp/vault-key.sha256
          [ "$(${COMPOSE} ps -q | wc -l)" = "2" ] || { echo "FAIL: expected exactly two containers (server, broker)"; ${COMPOSE} ps; exit 1; }

      - name: 'Cycle 4: verify the embedded MCP listener'
        run: |
          set -eu
          SERVER_CID=$(${COMPOSE} ps -q server)

          echo "--- the server still has no Docker socket, with MCP on ---"
          case "$(docker inspect --format '{{range .Mounts}}{{.Source}}:{{.Destination}} {{end}}' "${SERVER_CID}")" in
            *docker.sock*) echo "FAIL: server has a Docker socket mounted"; exit 1 ;;
          esac
          docker exec "${SERVER_CID}" sh -c '! test -e node_modules/dockerode && ! test -e apps/mcp/node_modules/dockerode'

          echo "--- the vault key is a mounted file, not an environment variable ---"
          docker exec "${SERVER_CID}" test -s /run/secrets/mcp_vault_key
          if docker exec "${SERVER_CID}" printenv MCP_VAULT_KEY >/dev/null; then echo "FAIL: the vault key is in the environment"; exit 1; fi

          echo "--- the MCP port is published on loopback only ---"
          PORTS=$(docker inspect --format '{{json .NetworkSettings.Ports}}' "${SERVER_CID}")
          echo "server ports: ${PORTS}"
          echo "${PORTS}" | grep -q '"3100/tcp":\[{"HostIp":"127.0.0.1"'

          echo "--- health over the published port; HTTPS enforced for everything else ---"
          curl -fsS http://127.0.0.1:3100/healthz | grep -q '"status":"ok"'
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/.well-known/oauth-authorization-server)
          [ "${CODE}" = "400" ] || { echo "FAIL: plain-HTTP metadata request returned ${CODE}"; exit 1; }

          echo "--- the panel API is not served on the MCP port, and OAuth is not served on the panel's ---"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Proto: https' http://127.0.0.1:3100/api/v1/health)
          [ "${CODE}" = "404" ] || { echo "FAIL: /api/v1/health on the MCP port returned ${CODE}"; exit 1; }
          # The panel answers unknown paths with its SPA shell; what must not
          # appear there is the MCP sign-in form.
          curl -s http://127.0.0.1:3000/oauth/authorize -o /tmp/panel-oauth.html
          if grep -q 'MCP username' /tmp/panel-oauth.html; then echo "FAIL: the panel port serves the OAuth sign-in page"; exit 1; fi

          echo "--- the MCP database lives in the server's own data volume ---"
          docker exec "${SERVER_CID}" sh -c 'ls /app/data/mcp/mcp.db'
          echo "All embedded MCP assertions passed."

      - name: 'Cycle 4: re-install keeps the vault key'
        run: |
          set -eu
          cp .env /tmp/env-before-mcp-reinstall
          ./installer/install.sh
          diff -q /tmp/env-before-mcp-reinstall .env
          sha256sum -c /tmp/vault-key.sha256

      - name: 'Cycle 4: MCP_ENABLED=false closes the listener but keeps its data'
        run: |
          set -eu
          MCP_ENABLED=false ./installer/install.sh
          if curl -fsS -m 2 http://127.0.0.1:3100/healthz; then echo "FAIL: the MCP listener still answers with MCP off"; exit 1; fi
          SERVER_CID=$(${COMPOSE} ps -q server)
          if docker inspect --format '{{json .NetworkSettings.Ports}}' "${SERVER_CID}" | grep -q '"3100/tcp":\['; then echo "FAIL: port 3100 is still published"; exit 1; fi
          if docker exec "${SERVER_CID}" test -e /run/secrets/mcp_vault_key; then echo "FAIL: the vault key is still mounted"; exit 1; fi
          docker exec "${SERVER_CID}" sh -c 'ls /app/data/mcp/mcp.db'
          sha256sum -c /tmp/vault-key.sha256
          MCP_ENABLED=true ./installer/install.sh
          curl -fsS http://127.0.0.1:3100/healthz | grep -q '"status":"ok"'

      - name: 'Cycle 4: default uninstall keeps the vault key and data volume'
        run: |
          set -eu
          ./installer/uninstall.sh
          docker volume inspect dwg-server-data >/dev/null
          sha256sum -c /tmp/vault-key.sha256

      - name: 'Cycle 4: --purge removes the vault key with the data'
        env:
          DWG_CONFIRM_PURGE: 'yes'
        run: |
          set -eu
          ./installer/uninstall.sh --purge
          docker volume inspect dwg-server-data >/dev/null 2>&1 && { echo "FAIL: dwg-server-data survived --purge"; exit 1; }
          [ ! -e secrets/mcp_vault_key ] || { echo "FAIL: the vault key survived --purge"; exit 1; }
          docker rm -f mailserver >/dev/null

      - name: Dump container logs on failure
        if: failure()
        run: |
          if [ -f .env ]; then
            ${COMPOSE} logs --no-color || true
          else
            COOKIE_SECRET=x BROKER_SHARED_SECRET=x DOCKER_GID=0 \
              docker compose -f docker/compose.yaml logs --no-color || true
          fi
          docker ps -a || true
          docker volume ls || true

  # The real-daemon half of panel self-update (SU-F, docs/design/
  # self-update.md §8: "What fakes genuinely cannot prove ... that needs a
  # real daemon"). Every other self-update test (SU-A through SU-E) runs
  # against fakes/stubs — this is the one place a real Docker Engine
  # actually recreates `dwg-server`/`dwg-broker` onto a genuinely different
  # image and is asserted to come back healthy. Mirrors the installer job's
  # own "install -> healthy -> uninstall" shape: bring up a real stack on a
  # real runner, act on it for real, assert the real result.
  #
  # --- The one problem worth explaining up front: where does "the newer
  # version" come from? ---
  #
  # `operations.ts`'s `handlePanelSelfUpdateApply` composes both target
  # image references from two hardcoded `ghcr.io/arvinrahnama/…` constants
  # (`apps/broker/src/self-update/image-refs.ts`) plus the request's own
  # `targetVersion`, and the updater then does a real `docker pull` of
  # that reference. Nothing "newer" is ever actually published to GHCR for
  # this test to pull — publishing a throwaway version to the real,
  # public registry on every CI run is not something this project does.
  #
  # Chosen fix: a disposable local registry (`registry:2`, this job's own
  # runner) the runner pushes two real, differently-versioned builds to
  # (v0.9.0 "old", v0.9.1 "new" — see the build step), plus one narrow,
  # broker-only escape hatch: `DANGEROUSLY_OVERRIDE_SELF_UPDATE_REGISTRY`,
  # an env var read once at broker process startup
  # (`apps/broker/src/config.ts`) and threaded through `OperationDeps`
  # (`apps/broker/src/operations.ts`) into `resolvePanelRepository`
  # (`apps/broker/src/self-update/image-refs.ts`), which replaces only the
  # registry *host* half of the two fixed repository constants — never the
  # fixed `docker-webmail-gui-server`/`-broker` repository *names*. It is
  # NOT a `BrokerRequest` field: `PanelSelfUpdateApplyRequestSchema`
  # (`packages/shared/src/broker.ts`) is completely unchanged by this,
  # still carrying only `targetVersion`, so `broker.test.ts`'s poison sweep
  # (every dangerous key rejected on every operation) needed no changes and
  # still passes — there is no new field anywhere a client could reach.
  # `docker/compose.yaml` never sets this env var for either service; the
  # only place it is ever set is this job's own CI-only compose
  # override file, generated below, never committed to the repository.
  # Rejected alternative: pre-seeding the daemon and making `pullImage`
  # tolerate an already-present tag — weaker, since it would mean the
  # "real pull" this job exists to prove never actually happens; this
  # job instead forces one (see the "drop the local copy" step below).
  #
  # The pull itself is unaffected by `dwg-broker`'s own `internal: true`
  # network (docs/design/self-update.md §1, "Registry access from an
  # `internal: true` network"): a pull issued over the Docker socket is
  # performed by the *daemon*, using the *host's* networking, not the
  # calling container's — which is exactly why the daemon only needs to
  # trust `localhost:5000` (this job's own step), not `dwg-broker` itself.
  #
  # --- A second version source worth naming explicitly ---
  #
  # `/api/v1/health`'s reported version (`APP_VERSION`,
  # `packages/shared/src/version.ts`) is a *separate* thing from the
  # `DWG_VERSION` build arg self-update's own facts (`panel.selfUpdateCheck`,
  # the status file) are baked from: `APP_VERSION` is read at runtime from
  # the repository root `package.json`'s own `"version"` field. A real
  # release keeps the two in lockstep (the release process bumps
  # `package.json`, the git tag, and `DWG_VERSION` all together), so this
  # job bumps `package.json` to match `DWG_VERSION` before each test build
  # too (see the two build steps below) — otherwise the health endpoint
  # would keep reporting whatever version this checkout's `package.json`
  # already said, regardless of which "version" the test images were built
  # as, and the swap verification could never pass honestly.
  #
  # --- The stale-version regression (1.0.0 -> 1.0.1 in production) ---
  #
  # A container's `Config.Env` is Docker's merge of its image's `ENV` with
  # the container's own env. The pre-fix updater recreated each container
  # with that whole merged list, pinning the OLD image's `DWG_VERSION` onto
  # the new container as explicit env, and `panel.selfUpdateCheck` (which
  # read the container env) then reported the old version forever. The
  # containers this job brings up are created exactly the way production's
  # are — `docker compose up` with the compose `environment:` — so the
  # merge happens here too, and a pre-fix updater would visibly pin
  # `DWG_VERSION=0.9.0` onto the v0.9.1 containers.
  #
  # Production is *already* polluted, though, and its next update is run by
  # the installed (pre-fix) updater, which pollutes again. So the CI
  # override below also pins a stale `DWG_VERSION=0.8.0` (`STALE_VERSION`)
  # into both v0.9.0 containers' own env — the state a pre-fix update leaves
  # behind — and the job asserts, against a real daemon:
  #
  #  1. before the update, `panel.selfUpdateCheck` reports 0.9.0 (the image),
  #     not 0.8.0 (the polluted container env);
  #  2. after the update, neither new container's `Config.Env` still carries
  #     a pinned old/stale `DWG_VERSION` (the updater no longer copies
  #     image-owned env, and heals what was pinned before);
  #  3. after the update, `panel.selfUpdateCheck` reports 0.9.1 for both —
  #     exactly what the panel's "update available" banner reads.
  #
  # What it cannot reproduce: the pre-fix updater itself. The "old" image is
  # built from this same checkout, so the updater that runs here is always
  # the fixed one; a buggy updater running against the fixed check is
  # covered by `apps/broker` unit tests (`operations.test.ts`,
  # `self-update/updater.test.ts`), not by this job.
  #
  # --- What this job does not attempt ---
  #
  # A forced-failure/rollback run (a target build with a genuinely broken
  # healthcheck) is not included here. The clone-based recreate
  # (`RawContainerRecreateSpec`) does not capture a `Healthcheck` override
  # at all, so a compose-level "always unhealthy" override on the
  # *initial* container would not propagate to the container the updater
  # later creates from the captured spec — forcing a real rollback needs a
  # genuinely broken target *image*, which is a bigger, separately-reviewed
  # follow-up. This job asserts the success path in full: both containers
  # recreated onto the new image, both healthy, the status file reporting
  # success with the correct from/to versions.
  self-update:
    name: Real-daemon self-update (build -> apply -> swap -> healthy)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGISTRY: localhost:5000
      OWNER: arvinrahnama
      OLD_VERSION: 0.9.0
      NEW_VERSION: 0.9.1
      # Never built — only ever pinned into the old containers' env to
      # simulate a pre-fix self-update's pollution (see the comment above).
      STALE_VERSION: 0.8.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Confirm this runner actually has Docker (the whole point of running here)
        run: |
          docker version
          docker compose version

      # Merges into whatever daemon.json the runner already ships
      # (never overwrites it outright) — see the comment above this job for why
      # the daemon, not `dwg-broker`, is the thing that needs to trust
      # this host.
      - name: Configure the daemon to trust the disposable local registry
        run: |
          set -eu
          sudo mkdir -p /etc/docker
          EXISTING='{}'
          if [ -s /etc/docker/daemon.json ]; then
            EXISTING="$(cat /etc/docker/daemon.json)"
          fi
          echo "${EXISTING}" | jq '. + {"insecure-registries": ["localhost:5000"]}' \
            | sudo tee /etc/docker/daemon.json >/dev/null
          cat /etc/docker/daemon.json
          sudo systemctl restart docker
          timeout 30 sh -c 'until docker version >/dev/null 2>&1; do sleep 1; done'

      - name: Start the disposable local registry
        run: |
          docker run -d --name local-registry -p 5000:5000 registry:2
          timeout 30 sh -c 'until curl -fsS http://localhost:5000/v2/ >/dev/null 2>&1; do sleep 1; done'
          echo "confirmed: local registry answering on localhost:5000."

      # Two real builds per image, differing only in the two SU-E build
      # args (docker/server/Dockerfile, docker/broker/Dockerfile) — a
      # genuinely different baked DWG_VERSION, not just a different tag
      # on identical content, so the whole chain (baked version ->
      # panel.selfUpdateCheck -> apply -> real swap -> new baked version
      # observable afterward) is exercised for real, not simulated.
      #
      # The "old" build also gets a second, local-only tag under the
      # real, unoverridden PANEL_SERVER_REPOSITORY/PANEL_BROKER_REPOSITORY
      # names (never pushed anywhere — nothing ever pulls it) purely so
      # `updater.ts`'s `resolveFromVersion` — which searches a running
      # container's own image for a repo tag under that exact prefix —
      # can find a match and honestly report `fromVersion` in the status
      # file, the same as it would for a real GHCR-pulled install.
      # `APP_VERSION` (`packages/shared/src/version.ts`) is a *separate*
      # source from the `DWG_VERSION` build arg: it is read at runtime
      # from the repository root `package.json`'s own `"version"` field,
      # baked into each image by the `COPY --from=prod-deps .../package.json`
      # step, not from anything self-update itself resolves. In a real
      # release both agree by construction (the release process bumps
      # `package.json`, the git tag, and `DWG_VERSION` together) — bumped
      # here too, for the same reason, so `/api/v1/health`'s reported
      # version and self-update's own baked-`DWG_VERSION` facts agree
      # exactly as they would for a real release, rather than the test
      # images silently drifting from what a real build looks like.
      # `--no-git-tag-version`: no commit/tag, just the two files;
      # nothing here is ever pushed anywhere.
      - name: 'Build the "old" panel images (v0.9.0, registry-origin) and push to the local registry'
        run: |
          set -eu
          npm version "${OLD_VERSION}" --no-git-tag-version --allow-same-version
          for svc in server broker; do
            docker build \
              -f "docker/${svc}/Dockerfile" \
              --build-arg DWG_VERSION="${OLD_VERSION}" \
              --build-arg DWG_IMAGE_ORIGIN=registry \
              -t "${REGISTRY}/${OWNER}/docker-webmail-gui-${svc}:${OLD_VERSION}" \
              .
            docker tag \
              "${REGISTRY}/${OWNER}/docker-webmail-gui-${svc}:${OLD_VERSION}" \
              "ghcr.io/${OWNER}/docker-webmail-gui-${svc}:${OLD_VERSION}"
            docker push "${REGISTRY}/${OWNER}/docker-webmail-gui-${svc}:${OLD_VERSION}"
          done

      # Pushed, then the *local* copy is deliberately removed — without
      # this, the later `panel.selfUpdateApply` would find v0.9.1
      # already present locally (we just built it on this same runner)
      # and the "real pull" this job exists to prove would be a same-
      # digest no-op rather than a genuine fetch from the registry.
      - name: 'Build the "new" panel images (v0.9.1, registry-origin), push, then drop the local copy'
        run: |
          set -eu
          npm version "${NEW_VERSION}" --no-git-tag-version --allow-same-version
          for svc in server broker; do
            docker build \
              -f "docker/${svc}/Dockerfile" \
              --build-arg DWG_VERSION="${NEW_VERSION}" \
              --build-arg DWG_IMAGE_ORIGIN=registry \
              -t "${REGISTRY}/${OWNER}/docker-webmail-gui-${svc}:${NEW_VERSION}" \
              .
            docker push "${REGISTRY}/${OWNER}/docker-webmail-gui-${svc}:${NEW_VERSION}"
            docker rmi "${REGISTRY}/${OWNER}/docker-webmail-gui-${svc}:${NEW_VERSION}"
          done

      # Hand-written, not `installer/install.sh`: that script's own job is
      # choosing pull-vs-build against the *real* GHCR image name, which
      # is exactly what this job must not do. Only the three variables
      # `docker/compose.yaml` actually requires (`:?`) — everything else
      # keeps that file's own defaults.
      - name: Write a minimal .env for this job
        run: |
          set -eu
          COOKIE_SECRET="$(openssl rand -hex 32)"
          BROKER_SHARED_SECRET="$(openssl rand -hex 32)"
          DOCKER_GID="$(getent group docker | cut -d: -f3)"
          {
            echo "COOKIE_SECRET=${COOKIE_SECRET}"
            echo "BROKER_SHARED_SECRET=${BROKER_SHARED_SECRET}"
            echo "DOCKER_GID=${DOCKER_GID}"
          } > .env

      # The one place `DANGEROUSLY_OVERRIDE_SELF_UPDATE_REGISTRY` is ever
      # set, anywhere in this project — the comment above this job explains
      # why. `image:` overrides both services onto this job's own
      # pre-built, pre-pushed v0.9.0 — `docker compose up` never builds
      # or pulls anything itself here, since both already exist locally
      # under these exact tags.
      #
      # `DWG_VERSION: STALE_VERSION` on both services is NOT something a
      # real install sets (`docker/compose.yaml` never does): it reproduces
      # the explicit, stale container env a pre-fix self-update leaves on
      # production containers — the comment above this job, "The stale-version
      # regression".
      - name: Write the CI-only compose override
        run: |
          cat > ci-self-update.override.yml <<EOF
          services:
            server:
              image: ${REGISTRY}/${OWNER}/docker-webmail-gui-server:${OLD_VERSION}
              environment:
                DWG_VERSION: '${STALE_VERSION}'
            broker:
              image: ${REGISTRY}/${OWNER}/docker-webmail-gui-broker:${OLD_VERSION}
              environment:
                DANGEROUSLY_OVERRIDE_SELF_UPDATE_REGISTRY: ${REGISTRY}/${OWNER}
                DWG_VERSION: '${STALE_VERSION}'
          EOF
          cat ci-self-update.override.yml

      - name: Bring up the panel stack on v0.9.0
        run: |
          docker compose -f docker/compose.yaml -f ci-self-update.override.yml --env-file .env up -d

      # Gates on Docker's own `.State.Health.Status`, not just an HTTP
      # 200 — both Dockerfiles' HEALTHCHECK is `start-period=15s
      # interval=30s retries=3`, so Docker reports `starting` (never
      # `healthy`, however promptly the app itself is actually answering
      # requests) until the first probe passes, which can be ~30-45s
      # after the container starts. A plain HTTP-200 loop can pass while
      # Docker still says `starting` — misleading here specifically
      # because the *next* thing this job does (`panel.selfUpdateApply`)
      # launches an updater that itself gates on this exact field
      # (`docker inspect` -> `.State.Health.Status`, `updater.ts`'s
      # `waitForHealthy`), so this stack-is-up gate has to check the same
      # signal the feature under test actually relies on. Budgeted at
      # 150s — comfortably past the ~45s worst-case first-flip time, not
      # a change to the production HEALTHCHECK timing itself.
      - name: Wait for the v0.9.0 stack to become healthy
        run: |
          set -eu
          DEADLINE=$(( $(date +%s) + 150 ))
          while :; do
            SERVER_HEALTH=$(docker inspect dwg-server --format '{{.State.Health.Status}}' 2>/dev/null || echo '')
            BROKER_HEALTH=$(docker inspect dwg-broker --format '{{.State.Health.Status}}' 2>/dev/null || echo '')
            echo "server health=${SERVER_HEALTH} | broker health=${BROKER_HEALTH}"
            if [ "${SERVER_HEALTH}" = "healthy" ] && [ "${BROKER_HEALTH}" = "healthy" ]; then
              echo "confirmed: both containers report Docker health.status=healthy."
              break
            fi
            if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
              echo "FAIL: timed out waiting for the v${OLD_VERSION} stack's Docker health.status to flip to healthy"
              exit 1
            fi
            sleep 3
          done

          curl -fsS http://127.0.0.1:3000/api/v1/health | tee /tmp/health-old.json
          jq -e --arg v "${OLD_VERSION}" '.version == $v' /tmp/health-old.json >/dev/null
          echo "confirmed: v${OLD_VERSION} up and healthy (Docker health.status and HTTP both) before triggering anything."

      # No curl inside either image on purpose (both Dockerfiles' own
      # header) and the broker publishes no port to the host at all
      # (the installer job's own check) — `docker exec` into the broker's
      # own container and speak to its own loopback with Node's global
      # `fetch`, the same idiom both Dockerfiles' HEALTHCHECKs already
      # use. The broker already has its own `BROKER_SHARED_SECRET` in its
      # environment (compose sets it), so nothing needs passing in.
      - name: 'panel.selfUpdateCheck: confirm both containers honestly report v0.9.0 (from the image, not the stale container env), registry-origin, possible'
        run: |
          set -eu
          # Precondition for this step meaning anything: the pollution is
          # really there in the containers' merged env.
          for c in dwg-server dwg-broker; do
            docker inspect "${c}" --format '{{json .Config.Env}}' \
              | jq -e --arg e "DWG_VERSION=${STALE_VERSION}" '(. // []) | any(.[]; . == $e)' >/dev/null \
              || { echo "FAIL: ${c} does not carry the simulated stale DWG_VERSION=${STALE_VERSION}"; exit 1; }
          done
          RESULT=$(docker exec dwg-broker node -e "
            fetch('http://127.0.0.1:4000/v1/ops', {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'x-broker-secret': process.env.BROKER_SHARED_SECRET },
              body: JSON.stringify({ operation: 'panel.selfUpdateCheck' }),
            }).then(async (r) => { console.log(await r.text()); process.exit(r.ok ? 0 : 1); });
          ")
          echo "${RESULT}"
          echo "${RESULT}" | jq -e --arg v "${OLD_VERSION}" \
            '.updatePossible == true and .serverVersion == $v and .brokerVersion == $v' >/dev/null

      # The updater runs with AutoRemove:true, so once it exits (success
      # *or* failure) every trace of it — logs included — disappears with
      # it, on top of dwg-broker itself possibly being replaced moments
      # later. A background watcher, started *before* the apply call so
      # it is already polling the instant the updater container can
      # possibly exist, is the only reliable way to have captured
      # anything by the time a later step might need it: it waits for a
      # container named dwg-self-update-updater to appear at all (by
      # `launch-updater.ts`'s own fixed name,
      # SELF_UPDATE_UPDATER_CONTAINER_NAME) and immediately starts
      # following its logs into a file — attaching to `docker logs -f`
      # keeps reading right up to the moment the container is actually
      # removed, not just up to whatever had been written when the
      # watcher first noticed it. `nohup ... & disown`, not a plain `&`
      # subshell: a GitHub Actions `run:` step is its own shell
      # invocation, and a background job merely started with `&` is not
      # guaranteed to survive that shell exiting once this step's own
      # commands finish — `nohup` makes it ignore the hangup signal and
      # `disown` removes it from this shell's job table, so it keeps
      # running (and this step still returns immediately either way).
      - name: 'panel.selfUpdateApply: trigger a REAL self-update to v0.9.1'
        run: |
          set -eu
          rm -f /tmp/updater.log /tmp/updater-inspect.json
          nohup bash -c '
            for _ in $(seq 1 100); do
              CID=$(docker ps -aq -f name=dwg-self-update-updater | head -n1)
              if [ -n "${CID}" ]; then
                docker inspect "${CID}" > /tmp/updater-inspect.json 2>&1 || true
                docker logs -f "${CID}" > /tmp/updater.log 2>&1 || true
                break
              fi
              sleep 0.1
            done
          ' > /tmp/updater-watcher.log 2>&1 &
          disown

          RESULT=$(docker exec dwg-broker node -e "
            fetch('http://127.0.0.1:4000/v1/ops', {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'x-broker-secret': process.env.BROKER_SHARED_SECRET },
              body: JSON.stringify({ operation: 'panel.selfUpdateApply', targetVersion: '${NEW_VERSION}' }),
            }).then(async (r) => { console.log(await r.text()); process.exit(r.ok ? 0 : 1); });
          ")
          echo "${RESULT}"
          echo "${RESULT}" | jq -e '.started == true' >/dev/null
          echo "point of no return reached — the updater is launched; dwg-broker may be replaced at any moment now."

      # Bounded, and tolerant of the container genuinely not existing for
      # a moment mid-swap (stop -> remove -> create -> start) — a failed
      # `docker inspect` during that gap means "not there yet", not an
      # error, exactly like `updater.ts`'s own health-poll treats a
      # not-yet-healthy container. Budgeted well past the updater's own
      # worst case: `HEALTH_POLL_TIMEOUT_MS` (90s) applies *per
      # container*, and the success path recreates server then broker
      # sequentially — up to 90s + 90s = 180s of updater-internal
      # polling alone is legitimate, on top of each container's own
      # ~30-45s to reach its first Docker health.status=healthy flip
      # (same HEALTHCHECK timing as the previous wait step) and the pull
      # itself (fast, local registry, but not instant). 300s leaves
      # comfortable margin over that 180s+ worst case, not a change to
      # any production timeout.
      - name: Wait for the real swap to finish — both containers on v0.9.1, both healthy
        run: |
          set -eu
          DEADLINE=$(( $(date +%s) + 300 ))
          while :; do
            SERVER_IMAGE=$(docker inspect dwg-server --format '{{.Config.Image}}' 2>/dev/null || echo '')
            SERVER_HEALTH=$(docker inspect dwg-server --format '{{.State.Health.Status}}' 2>/dev/null || echo '')
            BROKER_IMAGE=$(docker inspect dwg-broker --format '{{.Config.Image}}' 2>/dev/null || echo '')
            BROKER_HEALTH=$(docker inspect dwg-broker --format '{{.State.Health.Status}}' 2>/dev/null || echo '')
            echo "server: image=${SERVER_IMAGE} health=${SERVER_HEALTH} | broker: image=${BROKER_IMAGE} health=${BROKER_HEALTH}"

            if [ "${SERVER_IMAGE}" = "${REGISTRY}/${OWNER}/docker-webmail-gui-server:${NEW_VERSION}" ] && \
               [ "${SERVER_HEALTH}" = "healthy" ] && \
               [ "${BROKER_IMAGE}" = "${REGISTRY}/${OWNER}/docker-webmail-gui-broker:${NEW_VERSION}" ] && \
               [ "${BROKER_HEALTH}" = "healthy" ]; then
              echo "confirmed: both containers swapped onto v${NEW_VERSION} and are healthy."
              break
            fi

            if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
              echo "FAIL: timed out waiting for the real self-update to finish"
              exit 1
            fi
            sleep 3
          done

      - name: Verify the public health endpoint reports the new version too
        run: |
          set -eu
          curl -fsS http://127.0.0.1:3000/api/v1/health | tee /tmp/health-new.json
          jq -e --arg v "${NEW_VERSION}" '.version == $v' /tmp/health-new.json >/dev/null

      # Regression guard for the updater half of the stale-version bug
      # (the comment above this job). Checked on the containers' own `Config.Env`,
      # not through `panel.selfUpdateCheck` — the check reads the image, so
      # it would pass even if the updater still pinned old env.
      - name: 'Regression guard: the new containers carry no DWG_VERSION pinned from the old image or the stale pollution'
        run: |
          set -eu
          for c in dwg-server dwg-broker; do
            ENV_JSON=$(docker inspect "${c}" --format '{{json .Config.Env}}')
            echo "${c} Config.Env: ${ENV_JSON}"
            if ! echo "${ENV_JSON}" | jq -e \
                --arg new "DWG_VERSION=${NEW_VERSION}" \
                --arg old "DWG_VERSION=${OLD_VERSION}" \
                --arg stale "DWG_VERSION=${STALE_VERSION}" \
                '(. // []) | any(.[]; . == $new) and (any(.[]; . == $old or . == $stale) | not)' >/dev/null; then
              echo "FAIL: ${c}'s env still pins an old DWG_VERSION (or lacks DWG_VERSION=${NEW_VERSION}) — the updater copied image-owned env onto the new container"
              exit 1
            fi
          done
          echo "confirmed: both recreated containers take DWG_VERSION from the v${NEW_VERSION} image."

      # The exact call the panel's "update available" banner depends on,
      # re-run after the real update — the pre-update step above made the
      # same call. Production's bug was this still answering the OLD version.
      - name: 'Regression guard: panel.selfUpdateCheck reports v0.9.1 for both containers after the update'
        run: |
          set -eu
          RESULT=$(docker exec dwg-broker node -e "
            fetch('http://127.0.0.1:4000/v1/ops', {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'x-broker-secret': process.env.BROKER_SHARED_SECRET },
              body: JSON.stringify({ operation: 'panel.selfUpdateCheck' }),
            }).then(async (r) => { console.log(await r.text()); process.exit(r.ok ? 0 : 1); });
          ")
          echo "${RESULT}"
          if ! echo "${RESULT}" | jq -e \
              --arg v "${NEW_VERSION}" --arg old "${OLD_VERSION}" --arg stale "${STALE_VERSION}" \
              '.serverVersion == $v and .brokerVersion == $v
               and .serverVersion != $old and .brokerVersion != $old
               and .serverVersion != $stale and .brokerVersion != $stale
               and .updatePossible == true' >/dev/null; then
            echo "FAIL: after a successful update to v${NEW_VERSION}, panel.selfUpdateCheck does not report v${NEW_VERSION} for both containers — the panel would keep offering the update it just applied"
            exit 1
          fi
          echo "confirmed: panel.selfUpdateCheck reports v${NEW_VERSION} for both containers after the update."

      # The status file lives on the server-data named volume, shared
      # between the (now-gone) updater container and the new dwg-server
      # (docs/design/self-update.md §4) — read as dwg-server's own user
      # (`docker exec dwg-server cat ...`), deliberately never a root
      # side-reader: that is exactly the real thing being proven here —
      # the *same* process and user that `GET .../panel/last-result`
      # (SU-C) actually runs as must be able to read what the updater
      # wrote. A previous real run wrote a genuinely correct status file
      # and still failed this exact read, silently: `docker exec` failing
      # under `set -eu` inside a `$(...)` substitution aborts the script
      # before the next `echo` ever runs, so the *cause* (the updater's
      # container ran as a different, more-restrictive-umask user —
      # `result-file-writer.ts`'s own header has the full account) never
      # made it into the log. Deliberately not `set -e` here any more:
      # stdout and stderr are captured to files explicitly, so a failure
      # prints its own cause — including `ls -l`, run the identical way
      # (`docker exec dwg-server`), which shows the file's actual mode —
      # before this step exits.
      - name: Verify the status file reports a real success, with the correct from/to versions
        run: |
          set -u
          # The updater writes the status file in two phases (design §4): an
          # `in-progress` rollback plan BEFORE any teardown, then the final
          # `done` verdict only AFTER both containers are recreated and healthy.
          # The swap-wait above gates on both being healthy, which the updater
          # reaches (server first, then broker) a beat before it finalizes
          # `done` — so poll for the terminal verdict rather than reading once,
          # exactly as the panel's own UI now polls GET /panel/last-result
          # (`apps/web/src/maintenance/panel-update-card.tsx` `waitForPanelVerdict`).
          # Read as dwg-server's own non-root user every time, never a root
          # side-reader, so a regression of the file-permission fix still fails.
          # Bounded, so a genuinely stuck updater still fails the job.
          deadline=$(( $(date +%s) + 90 ))
          while :; do
            if ! docker exec dwg-server cat /app/data/self-update-result.json \
                > /tmp/status-file.json 2> /tmp/status-file.stderr; then
              # Not written yet (not even the in-progress record) — keep waiting.
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "FAIL: could not read the status file as dwg-server's own user within 90s"
                echo "--- docker exec stderr ---"; cat /tmp/status-file.stderr
                echo "--- ls -l /app/data/self-update-result.json, same user, for comparison ---"
                docker exec dwg-server ls -l /app/data/self-update-result.json || true
                exit 1
              fi
              sleep 3; continue
            fi
            phase=$(jq -r '.phase // ""' /tmp/status-file.json 2>/dev/null || echo "")
            [ "$phase" = "done" ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "FAIL: the status file never reached phase=done within 90s (last phase: '${phase}')"
              cat /tmp/status-file.json
              exit 1
            fi
            sleep 3
          done
          cat /tmp/status-file.json
          if ! jq -e --arg o "${OLD_VERSION}" --arg n "${NEW_VERSION}" \
              '.phase == "done" and .outcome == "success" and .fromVersion == $o and .toVersion == $n' \
              /tmp/status-file.json >/dev/null; then
            echo "FAIL: the status file reached phase=done but not the expected success verdict"
            exit 1
          fi
          echo "confirmed: the real updater wrote a real success verdict for a real v${OLD_VERSION} -> v${NEW_VERSION} swap, and dwg-server's own user could read it."

      # Every source of evidence for "the updater launched but nothing
      # happened" (the exact failure mode SU-F's first real run hit),
      # gathered unconditionally rather than guessing which one will
      # matter: the updater's own captured stdout/stderr and its last
      # `docker inspect` (from the background watcher above — present
      # even though AutoRemove has long since erased the container
      # itself), every container including exited ones (`-a`, not just
      # `ps`), and the status file straight off the server-data volume
      # (mounted directly by a disposable reader container, never via
      # `docker exec` into dwg-server/dwg-broker — by this point either
      # or both may not even exist to exec into). The updater writes a
      # `FAILED` status on its own error paths (`updater.ts`), so this
      # file is the single most likely place to find the real reason.
      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "--- updater container logs (captured live by the background watcher) ---"
          cat /tmp/updater.log 2>/dev/null || echo "(no updater.log — the watcher never saw the container, or it was still empty)"
          echo "--- updater container's last docker inspect ---"
          cat /tmp/updater-inspect.json 2>/dev/null || echo "(no updater-inspect.json)"
          echo "--- background watcher's own log ---"
          cat /tmp/updater-watcher.log 2>/dev/null || echo "(no updater-watcher.log)"
          echo "--- self-update-result.json on the server-data volume, read directly by root (never via docker exec) — compare against the dwg-server-user read above ---"
          docker run --rm -v dwg-server-data:/data:ro alpine:3.20 \
            sh -c 'ls -l /data/self-update-result.json 2>/dev/null; cat /data/self-update-result.json 2>/dev/null || echo "(no status file present on the volume)"'
          echo "--- docker ps -a (including exited containers) ---"
          docker ps -a || true
          echo "--- compose logs ---"
          docker compose -f docker/compose.yaml -f ci-self-update.override.yml --env-file .env logs --no-color || true

  # Runs apps/mcp's integration suite against a real docker-mailserver: real
  # Dovecot IMAP and Postfix submission over TLS, with the two test accounts
  # the suite expects (sales@example.test, support@example.test).
  #
  # Everything in the suite goes through the MCP service's public HTTP
  # surface — OAuth with a one-time setup credential, then MCP tool calls —
  # so a green run here means list/search/read/attachment/send/trash/restore
  # worked against a real mail server, not a fake. The TLS certificate is
  # issued by a throwaway CA created in this job and verified by the MCP
  # service exactly as a production deployment would (no `tlsVerify: false`).
  #
  # Not part of `npm test` (which uses the in-memory fake backend and needs
  # no Docker); the build-and-test job runs that.
  mcp-integration:
    name: Real IMAP/SMTP (docker-mailserver)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pinned major; DMS 15 is what the suite was developed against.
      DMS_IMAGE: ghcr.io/docker-mailserver/docker-mailserver:15
      DMS_CONTAINER: dwg-it-mailserver
      # Throwaway credentials for throwaway accounts in a throwaway container.
      SALES_PASSWORD: Sales-IMAP-pass-1
      SUPPORT_PASSWORD: Support-IMAP-pass-1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create a throwaway CA and a certificate for mail.example.test
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/dms/certs" "${RUNNER_TEMP}/dms/config"
          cd "${RUNNER_TEMP}/dms/certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj '/CN=dwg-mcp-it-ca' \
            -keyout ca.key -out ca.crt
          openssl req -newkey rsa:2048 -nodes -subj '/CN=mail.example.test' \
            -keyout mail.key -out mail.csr
          printf 'subjectAltName=DNS:mail.example.test\nextendedKeyUsage=serverAuth\n' > ext.cnf
          openssl x509 -req -in mail.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
            -days 2 -extfile ext.cnf -out mail.crt
          chmod 644 ./*

      # Seeded before the container starts, in the format `setup email add`
      # writes, so the mail server boots with both accounts: no race against
      # its start-up (`setup` refuses to run until DMS has loaded its
      # settings) and no wait for its change detector before the first login.
      - name: Create the two test accounts
        run: |
          set -eu
          {
            printf 'sales@example.test|{SHA512-CRYPT}%s\n' "$(openssl passwd -6 "${SALES_PASSWORD}")"
            printf 'support@example.test|{SHA512-CRYPT}%s\n' "$(openssl passwd -6 "${SUPPORT_PASSWORD}")"
          } > "${RUNNER_TEMP}/dms/config/postfix-accounts.cf"

      - name: Start docker-mailserver
        run: |
          set -eu
          docker run -d --name "${DMS_CONTAINER}" --hostname mail.example.test \
            -e ACCOUNT_PROVISIONER=FILE \
            -e SSL_TYPE=manual -e SSL_CERT_PATH=/certs/mail.crt -e SSL_KEY_PATH=/certs/mail.key \
            -e ENABLE_RSPAMD=0 -e ENABLE_CLAMAV=0 -e ENABLE_FAIL2BAN=0 -e ENABLE_AMAVIS=0 \
            -e ENABLE_SPAMASSASSIN=0 -e ENABLE_POSTGREY=0 -e ENABLE_OPENDKIM=0 \
            -e ENABLE_OPENDMARC=0 -e ENABLE_POLICYD_SPF=0 -e SPOOF_PROTECTION=1 -e LOG_LEVEL=warn \
            -v "${RUNNER_TEMP}/dms/certs:/certs:ro" \
            -v "${RUNNER_TEMP}/dms/config:/tmp/docker-mailserver" \
            -p 127.0.0.1:19993:993 -p 127.0.0.1:19465:465 -p 127.0.0.1:19587:587 \
            "${DMS_IMAGE}"

      - name: Wait for IMAP and SMTP to accept TLS connections
        run: |
          set -eu
          node --input-type=module -e "
            import tls from 'node:tls';
            import { readFileSync } from 'node:fs';
            const ca = readFileSync(process.env.RUNNER_TEMP + '/dms/certs/ca.crt');
            const probe = (port) => new Promise((resolve) => {
              const s = tls.connect({ host: '127.0.0.1', port, servername: 'mail.example.test', ca }, () => { s.end(); resolve(true); });
              s.on('error', () => resolve(false));
            });
            for (let i = 0; i < 60; i++) {
              if ((await probe(19993)) && (await probe(19465))) { console.log('IMAP and SMTP ready'); process.exit(0); }
              await new Promise((r) => setTimeout(r, 3000));
            }
            console.error('mail server did not become ready'); process.exit(1);
          "

      - name: Run the integration suite
        env:
          MCP_IT_IMAP_HOST: 127.0.0.1
          MCP_IT_IMAP_PORT: '19993'
          MCP_IT_SMTP_HOST: 127.0.0.1
          MCP_IT_SMTP_PORT: '19465'
          MCP_IT_TLS_SERVERNAME: mail.example.test
          MCP_IT_SALES_PASSWORD: ${{ env.SALES_PASSWORD }}
          MCP_IT_SUPPORT_PASSWORD: ${{ env.SUPPORT_PASSWORD }}
          MCP_IT_DMS_CONTAINER: ${{ env.DMS_CONTAINER }}
        run: MCP_IT_CA_FILE="${RUNNER_TEMP}/dms/certs/ca.crt" npm run test:integration --workspace apps/mcp

      - name: Dump mail server logs on failure
        if: failure()
        run: docker logs "${DMS_CONTAINER}" 2>&1 | tail -200 || true

  # --- Dependency security: every job here reads only the dependency
  # manifests (plus the license gate's own script).
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Scoped to production dependencies: SECURITY.md §3.14's own control
      # is "multi-stage builds so build tooling never ships" — a
      # high/critical advisory in a devDependency (the SBOM generator, the
      # test/build toolchain) never reaches a shipped image, so gating the
      # build on it would fail CI for risk nobody using this project is
      # exposed to. `npm run check:audit` mirrors this exact command
      # locally (M12, SECURITY.md Part 5 check 10).
      - name: Audit production dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high

      # Full-tree audit, devDependencies included: informational only.
      # Surfaces a build/test-toolchain advisory (e.g. a vitest/vite CVE)
      # for a human to see without blocking every PR on a risk that never
      # ships.
      - name: Audit full dependency tree (informational)
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=high

  dependency-review:
    name: Dependency review
    # Diffs base vs. head, so it only makes sense on a pull request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # Fast, low-noise feedback on the obvious cases at PR time. The
          # authoritative check is the strict permissive allowlist in the
          # sbom job below, which covers the whole tree rather than just the
          # diff — this step only catches copyleft early, where the reviewer
          # can see it next to the change that introduced it.
          deny-licenses: >-
            AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later,
            GPL-2.0, GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0, GPL-3.0-only, GPL-3.0-or-later,
            LGPL-2.1, LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0, LGPL-3.0-only, LGPL-3.0-or-later,
            SSPL-1.0, BUSL-1.1, CC-BY-NC-4.0

  sbom:
    name: Generate SBOM
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate CycloneDX SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json

      # The control promised in SECURITY.md §3.14 and LICENSE_AUDIT.md §8.
      # Generating an SBOM without checking it would leave that control
      # documented but not real, which is exactly the kind of gap this
      # project treats as a defect.
      - name: License gate
        run: node scripts/check-licenses.mjs sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90
