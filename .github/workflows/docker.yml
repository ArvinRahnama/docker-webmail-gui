# Wired up ahead of schedule, before M13 ("Packaging + installer" — see
# IMPLEMENTATION_PLAN.md §3) landed the multi-stage Dockerfiles this
# discovers: docker/server/Dockerfile and docker/broker/Dockerfile. Auto-
# discovery (rather than a hardcoded matrix) means a Dockerfile added
# anywhere else under docker/ later is picked up with no edit to this
# file. It never pushes an image (push: false) — a fast build-only smoke
# test, not a release pipeline. `installer.yml` is the heavier, slower
# workflow: the actual install -> healthy -> uninstall cycle, twice,
# against these same two images.

name: Docker

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'docker/**'

permissions:
  contents: read

jobs:
  discover:
    name: Discover Dockerfiles
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dockerfiles: ${{ steps.find.outputs.dockerfiles }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find Dockerfiles under docker/
        id: find
        shell: bash
        run: |
          if [ -d docker ]; then
            files="$(find docker -type f -iname 'Dockerfile*' | sort | jq -R . | jq -sc .)"
          else
            files="[]"
          fi
          echo "dockerfiles=${files}" >> "$GITHUB_OUTPUT"
          echo "Found: ${files}"

  build:
    name: Build (no push)
    needs: discover
    if: needs.discover.outputs.dockerfiles != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJSON(needs.discover.outputs.dockerfiles) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
