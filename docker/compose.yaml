# docker-webmail-gui — production compose (M13, IMPLEMENTATION_PLAN.md §3;
# ARCHITECTURE.md §10; SECURITY.md §4.4). Written and read by
# installer/install.sh and installer/uninstall.sh — this file is the
# actual, enforced network/socket topology the architecture invariant
# depends on, not merely a description of it (AGENT_BRIEF.md §2).
#
# Two containers, two networks:
#
#   - `frontend`: reaches `server`. Put your own reverse proxy (TLS
#     termination, a real hostname) on this network too, or publish
#     `server`'s port directly for a plain LAN install — both are
#     supported; see PORT below. Never carries `broker`.
#   - `broker`: `internal: true` — no route to or from the internet, in
#     either direction. Carries `server` -> `broker` only. `broker`
#     itself is on no other network, so it is unreachable from
#     `frontend` and cannot reach the internet even if a bug tried to
#     make it (ARCHITECTURE.md §6).
#
# `server` holds no Docker socket — nothing in this file mounts
# `/var/run/docker.sock` into it, only into `broker`
# (docker/broker/Dockerfile's own header, and
# `apps/server/src/security/docker-socket-isolation.security.test.ts`,
# pin the same invariant from the image and source-tree sides).
#
# `broker`'s `group_add: - "${DOCKER_GID}"` is what lets it reach the
# socket *without* running as root (docker/broker/Dockerfile's own
# comment on why) — `DOCKER_GID` is the host's own `docker` group GID,
# detected and written to `.env` by `installer/install.sh`, never guessed
# or baked into the image.
#
# `docker-mailserver` itself is not a service in this file — it is not
# something this project deploys (DMS_CONTAINER_NAME/DMS_CONTAINER_LABEL,
# .env.example: "the broker resolves the mail container's identity
# itself... from configuration"). `install.sh` attaches `server` to
# whichever Docker network an already-running DMS container is on (for
# apps/server's direct Rspamd HTTP calls — the one thing that needs real
# network reachability to DMS, since every *Docker-level* operation goes
# through `broker`'s socket access, never a network call to DMS at all)
# once it finds one; until then this stack still comes up healthy on its
# own, DMS features reporting `Unknown` rather than the whole install
# refusing to start over a dependency that may not exist yet.
name: docker-webmail-gui

services:
  server:
    build:
      context: ..
      dockerfile: docker/server/Dockerfile
    image: docker-webmail-gui-server:${DWG_VERSION:-local}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    networks:
      - frontend
      - broker
    # `BIND_ADDRESS` defaults to every interface, which is what a plain
    # LAN install wants. Set it to 127.0.0.1 when a reverse proxy on this
    # host terminates TLS in front — the published port then exists only
    # for that proxy, and the panel is not reachable from the LAN on
    # plain HTTP at all. `install.sh` writes whatever value is in .env
    # back unchanged, so this survives a re-install.
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${PORT:-3000}:3000'
    environment:
      APP_MODE: production
      PORT: '3000'
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET must be set — generated by installer/install.sh}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_ABSOLUTE_TTL_HOURS: ${SESSION_ABSOLUTE_TTL_HOURS:-12}
      SESSION_IDLE_TTL_HOURS: ${SESSION_IDLE_TTL_HOURS:-2}
      # Both present-together-or-absent-together — config.ts enforces
      # this the same way even if compose alone did not.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BROKER_URL: http://broker:4000
      BROKER_SHARED_SECRET: ${BROKER_SHARED_SECRET:?BROKER_SHARED_SECRET must be set — generated by installer/install.sh}
      DMS_CONTAINER_NAME: ${DMS_CONTAINER_NAME:-mailserver}
      DMS_CONTAINER_LABEL: ${DMS_CONTAINER_LABEL:-}
      RSPAMD_URL: ${RSPAMD_URL:-http://mailserver:11334}
      RSPAMD_PASSWORD: ${RSPAMD_PASSWORD:-}
      ENABLE_EXEC_CONSOLE: ${ENABLE_EXEC_CONSOLE:-false}
      ENABLE_HSTS: ${ENABLE_HSTS:-true}
      # STATIC_DIR is deliberately *not* set here: docker/server/
      # Dockerfile bakes it (`ENV STATIC_DIR=/app/apps/web/dist`), because
      # the built SPA's location is a property of the image, not of a
      # deployment. Setting it here as well would let a .env typo detach
      # the server from the SPA it ships with, for no gain.
    volumes:
      - server-data:/app/data
      - server-backups:/app/backups
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      broker:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    # A runaway or exploited process cannot exhaust the host's PID space.
    # Generous relative to what a Fastify server actually uses (a handful
    # of threads plus libuv's pool), tight relative to a fork bomb.
    pids_limit: 512
    # `restart: unless-stopped` above means an unhealthy loop can run for
    # weeks; the default json-file driver grows without bound while it
    # does. Bounded here so a long-lived install cannot fill the host disk
    # with its own logs (docs/docker.md §6 lists unbounded-runtime
    # behaviour as otherwise unverified).
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  broker:
    build:
      context: ..
      dockerfile: docker/broker/Dockerfile
    image: docker-webmail-gui-broker:${DWG_VERSION:-local}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    group_add:
      - '${DOCKER_GID:?DOCKER_GID must be set to the host docker group GID — installer/install.sh detects this automatically}'
    tmpfs:
      - /tmp
    networks:
      - broker
    environment:
      BROKER_HOST: 0.0.0.0
      BROKER_PORT: '4000'
      BROKER_SHARED_SECRET: ${BROKER_SHARED_SECRET:?BROKER_SHARED_SECRET must be set — generated by installer/install.sh}
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      DMS_CONTAINER_NAME: ${DMS_CONTAINER_NAME:-mailserver}
      DMS_CONTAINER_LABEL: ${DMS_CONTAINER_LABEL:-}
    volumes:
      # The one bind mount `docker-socket-isolation.security.test.ts`
      # (M12) and this file's own header promise never appears on
      # `server`. Read-write: start/stop/restart/exec are all writes to
      # the Docker API, not just the read-only `container.list`/`stats`
      # family — `:ro` here would silently break every mutating broker
      # operation.
      - /var/run/docker.sock:/var/run/docker.sock:rw
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('node:net').connect({port:4000,host:'127.0.0.1'}).on('connect',function(){this.end();process.exit(0)}).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    # Tighter than `server`'s: this tier runs one route and a Docker
    # client, and is the one place where a runaway process would be
    # holding the socket while it ran.
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

networks:
  frontend:
    name: dwg-frontend
  broker:
    name: dwg-broker
    internal: true

volumes:
  server-data:
    name: dwg-server-data
  server-backups:
    name: dwg-server-backups
