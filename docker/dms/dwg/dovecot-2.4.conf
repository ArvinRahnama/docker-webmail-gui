# Docker Webmail GUI — docker-mailserver integration (docker/dms/README.md).
# Installed as /etc/dovecot/conf.d/95-dwg.conf by install.sh on every
# container start; edits made to the installed copy are lost.

# Point docker-mailserver's own spam-to-Junk step at our script, which adds
# the per-mailbox sender lists. Redefining the same named script replaces
# the path from 90-sieve.conf; when MOVE_SPAM_TO_JUNK=0 this creates it.
#
# bin_path: the compiled script embeds each mailbox's own included list, so
# it differs per mailbox and changes whenever the list does. Dovecot cannot
# write next to a global script at delivery time, so without this it would
# recompile on every message and log an error each time.
sieve_script spam_to_junk {
  type = after
  path = /usr/lib/dovecot/sieve-global/after/70-dwg-spam-to-junk.sieve
  bin_path = ~/.dwg-sieve-bin
}

# IMAPSieve must be on for the report hooks below, whether or not
# RSPAMD_LEARN=1 already turned it on.
protocol imap {
  mail_plugins {
    imap_sieve = yes
  }
}

# Moved into Junk: "this is spam" (block the sender).
mailbox Junk {
  sieve_script dwg_report_spam {
    cause = append copy
    driver = file
    name = DWG Report Spam
    path = /usr/lib/dovecot/sieve-pipe/dwg-report-spam.sieve
    type = before
  }
}

# Moved out of Junk: "not spam" (allow the sender).
imapsieve_from Junk {
  sieve_script dwg_report_ham {
    cause = append copy
    driver = file
    name = DWG Report Ham
    path = /usr/lib/dovecot/sieve-pipe/dwg-report-ham.sieve
    type = before
  }
}
